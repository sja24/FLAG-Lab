<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | Fields Lab</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="navbar">
  <div class="logo-container">

  <img src="images/Fields.png"
       alt="Fields Lab Logo"
       class="logo-image">

  <div class="logo-text">
    Fields Lab of Research and Genetics
  </div>

</div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="container">

  <section class="card">
    <h2 class="section-title">Research Dashboard</h2>

    <canvas id="lineChart"></canvas>
  </section>

</main>

<footer>
  <p>© 2026 Fields Lab of Research and Genetics</p>
</footer>

<script>
const ctx = document.getElementById('lineChart');

new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['2022', '2023', '2024', '2025', '2026'],
    datasets: [{
      label: 'Research Growth',
      data: [10, 20, 30, 40, 50],
      borderColor: '#2f5d3f',
      backgroundColor: 'rgba(47, 93, 63, 0.2)',
      fill: true
    }]
  }
});
</script>

</body>
</html>
